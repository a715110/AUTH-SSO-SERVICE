spring.application.name=sso
server.servlet.context-path=/

# HTTPS Configuration
server.port=8081
server.ssl.enabled=true
server.ssl.key-store=classpath:dodaso_keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=dodaso-server

# Trust Store Configuration (for outbound HTTPS calls)
server.ssl.trust-store=classpath:dodaso_truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12

# SSL Protocol Configuration
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
server.ssl.client-auth=none

# Eureka Client configuration
#eureka.instance.lease-renewal-interval-in-seconds=3
eureka.client.service-url.defaultZone=https://localhost:9443/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Eureka HTTPS configuration
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=false
eureka.instance.status-page-url=https://localhost:443/actuator/info
eureka.instance.health-check-url=https://localhost:443/actuator/health
eureka.instance.home-page-url=https://localhost:443/
eureka.client.registry-fetch-interval-seconds=5

eureka.client.tls.enabled=true
eureka.client.tls.trust-store=classpath:dodaso_truststore.p12
eureka.client.tls.trust-store-password=changeit
eureka.client.tls.trust-store-type=PKCS12

# OAuth2 Authorization Server Settings
spring.security.oauth2.authorizationserver.issuer=https://localhost:8081

#
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.servlet.session.cookie.name=SSOSESSIONID
server.servlet.session.cookie.max-age=43200
server.servlet.session.timeout=1800
server.servlet.session.tracking-modes=cookie

#Forwarded headers if we later sit behind a proxy (nginx, ALB, etc.)
server.forward-headers-strategy=framework

auth.jwt.header=Authorization
auth.jwt.expiration=30000000
auth.jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9

# Logging for debugging (optional)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# Disable JSF auto-configuration for SSO server
spring.autoconfigure.exclude[0]=org.joinfaces.autoconfigure.JsfAutoConfiguration
spring.autoconfigure.exclude[1]=org.joinfaces.autoconfigure.tomcat.JsfTomcatAutoConfiguration
spring.autoconfigure.exclude[2]=org.joinfaces.autoconfigure.FacesAutoConfiguration

dodaso.apps[0].name=ELCM
dodaso.apps[0].description=Enterprise Lease Contract Management
dodaso.apps[0].icon-url=/images/elcm-icon.png
dodaso.apps[0].url=https://localhost/elcm/dashboard
dodaso.apps[0].required-authority=

dodaso.apps[1].name=ECWS
dodaso.apps[1].description=Enterprise Collaborative Workflow System
dodaso.apps[1].icon-url=/images/ecws-icon.png
dodaso.apps[1].url=https://localhost/ecws/dashboard
dodaso.apps[1].required-authority=