# =====================================================================
# sso (ADEV-AUTH-SSO) - LOCAL profile (developer machine only; never deployed)
#
# Keystores live outside the project (shared by all dodaso apps):
#   ${user.home}/.dodaso/certs/dodaso_keystore.p12
# Override the folder with DODASO_CERT_DIR.
# Secret defaults below are dev-only values.
# =====================================================================

dodaso.local.cert-dir=${DODASO_CERT_DIR:${user.home}/.dodaso/certs}

dodaso.instance.customer-code=local
dodaso.instance.display-name=Local Dev
dodaso.instance.environment=local
dodaso.instance.ecws-base-url=https://localhost/ecws
dodaso.instance.elcm-base-url=https://localhost/elcm
dodaso.instance.auth-issuer-uri=https://localhost:8081

# HTTPS directly on 8081 (the UIs call the authorization server on this port)
server.port=8081
server.ssl.enabled=true
server.ssl.key-store=file:${dodaso.local.cert-dir}/dodaso_keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=dodaso-server
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
server.ssl.client-auth=none
# STEP1: server.ssl.trust-store removed. It only applies to client-certificate
# authentication (client-auth=none here); it never covered outbound calls.
# Outbound HTTPS uses the JVM truststore (-Djavax.net.ssl.trustStore).

# Local extras: the local UIs are configured with explicit ":443" URLs, and the
# old allow-list accepted both spellings. Derived values (https://localhost/elcm/...)
# are registered automatically on top of these.
dodaso.sso.extra-redirect-uris[0]=https://localhost:443/elcm/login/oauth2/code/sso
dodaso.sso.extra-redirect-uris[1]=https://localhost:443/ecws/login/oauth2/code/sso
dodaso.sso.extra-post-logout-redirects[0]=https://localhost:443/elcm/
dodaso.sso.extra-post-logout-redirects[1]=https://localhost:443/ecws/
dodaso.sso.default-post-logout-redirect=https://localhost:443/
dodaso.sso.extra-cors-origins[0]=https://localhost:443

# Signing key persisted across restarts (generated on first start, then reused)
dodaso.sso.jwk-key-file=${dodaso.local.cert-dir}/sso-jwk-private.pem

# Secrets that come from Key Vault in the cloud (dev values only)
sso-jsf-client-secret=${SSO_JSF_CLIENT_SECRET:jsf-client-secret}
platform-jwt-secret=${PLATFORM_JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}

# Eureka (only used if a Eureka client is on the classpath; see base file note).
# STEP1: registered port follows server.port (was 443 while listening on 8081).
eureka.client.service-url.defaultZone=https://localhost:9443/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.client.tls.enabled=true
eureka.client.tls.trust-store=file:${dodaso.local.cert-dir}/dodaso_truststore.p12
eureka.client.tls.trust-store-password=changeit
eureka.client.tls.trust-store-type=PKCS12
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.non-secure-port-enabled=false
eureka.instance.status-page-url=https://localhost:${server.port}/actuator/info
eureka.instance.health-check-url=https://localhost:${server.port}/actuator/health
eureka.instance.home-page-url=https://localhost:${server.port}/

# Debug logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
