<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
          radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .login-container {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow:
          0 32px 64px rgba(0, 0, 0, 0.2),
          0 0 0 1px rgba(255, 255, 255, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
      width: 100%;
      max-width: 420px;
      position: relative;
      animation: containerSlideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #4facfe);
      background-size: 300% 100%;
      animation: topBorderFlow 3s ease infinite;
    }

    @keyframes containerSlideUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes topBorderFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .login-header {
      text-align: center;
      margin-bottom: 3rem;
      padding-top: 1rem;
    }

    .login-header h1 {
      color: #1f2937;
      margin-bottom: 0.75rem;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #1f2937 0%, #4f46e5 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header p {
      color: #6b7280;
      margin: 0;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 2rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.75rem;
      color: #374151;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.025em;
    }

    .form-group input {
      width: 100%;
      padding: 1rem 1.25rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1.05rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow:
          0 0 0 3px rgba(102, 126, 234, 0.1),
          0 4px 12px rgba(102, 126, 234, 0.15);
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1px);
    }

    .form-group input:hover:not(:focus) {
      border-color: #d1d5db;
      background: rgba(255, 255, 255, 0.9);
    }

    .login-button {
      width: 100%;
      padding: 1.1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #5b73e8 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow:
          0 8px 20px rgba(102, 126, 234, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      letter-spacing: 0.025em;
    }

    .login-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow:
          0 12px 28px rgba(102, 126, 234, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .login-button:hover::before {
      opacity: 1;
    }

    .login-button:active {
      transform: translateY(0);
      transition: transform 0.1s ease;
    }

    .alert {
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      font-weight: 500;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .alert-error {
      background: linear-gradient(135deg, rgba(248, 215, 218, 0.9) 0%, rgba(248, 215, 218, 0.7) 100%);
      color: #721c24;
      border: 2px solid rgba(245, 198, 203, 0.8);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.15);
    }

    .alert-success {
      background: linear-gradient(135deg, rgba(212, 237, 218, 0.9) 0%, rgba(212, 237, 218, 0.7) 100%);
      color: #155724;
      border: 2px solid rgba(195, 230, 203, 0.8);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
    }

    .alert-warning {
      background: linear-gradient(135deg, rgba(255, 243, 205, 0.9) 0%, rgba(255, 243, 205, 0.7) 100%);
      color: #856404;
      border: 2px solid rgba(255, 234, 167, 0.8);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }

    .session-expired-notice {
      display: none;
      background: linear-gradient(135deg, rgba(225, 245, 254, 0.9) 0%, rgba(225, 245, 254, 0.7) 100%);
      color: #01579b;
      border: 2px solid rgba(129, 212, 250, 0.8);
      padding: 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
    }

    .timeout-notice {
      background: linear-gradient(135deg, rgba(255, 243, 205, 0.9) 0%, rgba(255, 243, 205, 0.7) 100%);
      color: #856404;
      border: 2px solid rgba(255, 234, 167, 0.8);
      padding: 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }

    .refresh-button {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .refresh-button:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }

    .alert strong {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 1.05rem;
    }

    .alert p {
      margin: 0;
      line-height: 1.5;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .login-container {
        padding: 2rem 1.5rem;
        border-radius: 20px;
      }

      .login-header h1 {
        font-size: 1.9rem;
      }

      .form-group input {
        padding: 0.9rem 1rem;
      }

      .login-button {
        padding: 1rem;
        font-size: 1.05rem;
      }
    }

    /* Accessibility & Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      body,
      .login-container,
      .form-group input,
      .login-button {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Focus indicators for accessibility */
    .refresh-button:focus,
    .login-button:focus {
      outline: 3px solid rgba(102, 126, 234, 0.5);
      outline-offset: 2px;
    }

    /* Dark theme support */
    @media (prefers-color-scheme: dark) {
      .login-container {
        background: linear-gradient(145deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.9) 100%);
      }

      .login-header h1 {
        background: linear-gradient(135deg, #f9fafb 0%, #a5b4fc 50%, #c4b5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .login-header p {
        color: #d1d5db;
      }

      .form-group label {
        color: #f3f4f6;
      }

      .form-group input {
        background: rgba(31, 41, 55, 0.8);
        border-color: #4b5563;
        color: #f9fafb;
      }

      .form-group input:focus {
        background: rgba(31, 41, 55, 0.95);
        border-color: #667eea;
      }
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <h1>Sign In</h1>
    <p>Authorization Server</p>
  </div>

  <!-- Timeout Notice (from cookie detection) -->
  <div id="timeoutNotice" class="timeout-notice" style="display: none;">
    <strong>Your session has expired.</strong>
    <p>Please log in again to continue.</p>
  </div>

  <!-- Session Expired Notice (from JavaScript timer) -->
  <div id="sessionExpiredNotice" class="session-expired-notice">
    <strong>Your session has expired.</strong>
    <p>Please click the button below to refresh and login again.</p>
    <button type="button" class="refresh-button" onclick="refreshPage()">
      Refresh Page
    </button>
  </div>

  <!-- Server-side session timeout message -->
  <div th:if="${sessionExpired}" class="alert alert-warning">
    <strong>Session Expired</strong>
    <p>Your session has expired. Please log in again to continue.</p>
  </div>

  <!-- Error Message -->
  <div th:if="${error}" class="alert alert-error">
    <span th:text="${error}">Error message</span>
  </div>

  <!-- Success Message -->
  <div th:if="${message}" class="alert alert-success">
    <span th:text="${message}">Success message</span>
  </div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>

    <button id="loginButton" type="submit" class="login-button">Sign In</button>
  </form>
</div>
<script>
  (function () {
    function getCookie(name) {
      const match = document.cookie.split(';')
      .map(c => c.trim())
      .find(c => c.startsWith(name + '='));
      if (!match) return null;
      return decodeURIComponent(match.split('=')[1]);
    }

    const flag = getCookie('loginReason');
    if (flag === 'timeout') {
      const el = document.getElementById('timeoutNotice');
      if (el) el.style.display = 'block';
    }

    // Always clear the flag so refresh doesn't keep showing it
    document.cookie = "loginReason=; Max-Age=0; Path=/; Secure; SameSite=None";
  })();
</script>
</body>
</html>
