<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoDesk AI Applications</title>
  <style>
    /* REVISED 2026-10-18: calmer, more professional launcher. Same gradient family and card
       corner as the login page, with the DoDesk AI logo, real application icons, and a
       light or dark card that follows the system setting. */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 55%, #8e6bbf 100%);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #24364a;
    }

    .launcher-container {
      background: #ffffff;
      padding: 2.5rem 2.5rem 2rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 32px 64px rgba(20, 20, 60, 0.28);
      width: 100%;
      max-width: 640px;
      animation: rise 0.5s ease-out;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .launcher-header {
      text-align: center;
      padding-bottom: 1.5rem;
      margin-bottom: 1.75rem;
      border-bottom: 1px solid #e3e8ee;
    }

    .brand img {
      display: block;
      margin: 0 auto 1.25rem;
      height: 52px;
      width: auto;
    }

    .launcher-header h1 {
      margin: 0 0 0.4rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #24364a;
    }

    .launcher-header p {
      margin: 0;
      color: #5b6b7d;
      font-size: 1rem;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem;
    }

    .app-tile {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.25rem;
      border-radius: 16px;
      border: 1px solid #e3e8ee;
      background: #f7f9fc;
      text-decoration: none;
      color: #24364a;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .app-tile:hover {
      border-color: #5b6fd6;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(36, 54, 74, 0.18);
    }

    .app-tile:focus-visible {
      outline: 3px solid #4f46e5;
      outline-offset: 2px;
    }

    .app-tile img {
      width: 56px;
      height: 56px;
      flex: 0 0 auto;
    }

    .app-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .app-tile .app-name {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
    }

    .app-tile .app-desc {
      font-size: 0.82rem;
      color: #5b6b7d;
      line-height: 1.35;
      margin-top: 0.15rem;
    }

    .empty-state {
      text-align: center;
      color: #5b6b7d;
      font-size: 1.05rem;
      padding: 1.5rem 0;
    }

    @media (max-width: 480px) {
      .launcher-container { padding: 2rem 1.25rem 1.5rem; border-radius: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .launcher-container { animation: none; }
      .app-tile { transition: none; }
    }

    @media (prefers-color-scheme: dark) {
      .launcher-container { background: #1c2733; border-color: rgba(255, 255, 255, 0.12); }
      body { color: #f1f5f9; }
      .launcher-header { border-bottom-color: #2d3b4a; }
      .launcher-header h1 { color: #f1f5f9; }
      .launcher-header p, .app-tile .app-desc, .empty-state { color: #a5b3c3; }
      .app-tile { background: #243241; border-color: #34455a; color: #f1f5f9; }
      .app-tile:hover { border-color: #8fa0f2; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); }
      .app-tile:focus-visible { outline-color: #a5b4fc; }
    }
  </style>
</head>
<body>
<main class="launcher-container">
  <div class="launcher-header">
    <picture class="brand">
      <source media="(prefers-color-scheme: dark)" th:srcset="@{/images/dodesk-ai-logo-white.svg}">
      <img th:src="@{/images/dodesk-ai-logo-black.svg}" alt="DoDesk AI">
    </picture>
    <h1>Applications</h1>
    <p>Select an application to continue</p>
  </div>

  <div class="app-grid" th:if="${not #lists.isEmpty(apps)}">
    <a class="app-tile" th:each="app : ${apps}" th:href="${app.url}">
      <img th:src="${app.iconUrl}" th:alt="${app.name}"/>
      <span class="app-text">
        <span class="app-name" th:text="${app.name}">App Name</span>
        <span class="app-desc" th:text="${app.description}">Description</span>
      </span>
    </a>
  </div>

  <p class="empty-state" th:if="${#lists.isEmpty(apps)}">
    No applications are currently available for your account.
  </p>
</main>
</body>
</html>
