<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
          radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .launcher-container {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.85) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow:
          0 32px 64px rgba(0, 0, 0, 0.2),
          0 0 0 1px rgba(255, 255, 255, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
      width: 100%;
      max-width: 760px;
      position: relative;
      animation: containerSlideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .launcher-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #4facfe);
      background-size: 300% 100%;
      animation: topBorderFlow 3s ease infinite;
    }

    @keyframes containerSlideUp {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes topBorderFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .launcher-header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-top: 1rem;
    }

    .launcher-header h1 {
      color: #1f2937;
      margin-bottom: 0.75rem;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #1f2937 0%, #4f46e5 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .launcher-header p {
      color: #6b7280;
      margin: 0;
      font-size: 1.1rem;
      font-weight: 500;
    }

    .app-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    .app-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 160px;
      padding: 1.5rem 1rem;
      border-radius: 16px;
      border: 2px solid #e5e7eb;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      color: #1f2937;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-tile:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(102, 126, 234, 0.25);
      background: rgba(255, 255, 255, 0.95);
    }

    .app-tile img {
      width: 56px;
      height: 56px;
      margin-bottom: 0.9rem;
    }

    .app-tile .app-name {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.25rem;
    }

    .app-tile .app-desc {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
      line-height: 1.3;
    }

    .empty-state {
      text-align: center;
      color: #6b7280;
      font-size: 1.05rem;
      padding: 2rem 0;
    }

    @media (max-width: 480px) {
      .launcher-container { padding: 2rem 1.5rem; border-radius: 20px; }
      .launcher-header h1 { font-size: 1.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, .launcher-container { animation: none !important; transition: none !important; }
    }

    @media (prefers-color-scheme: dark) {
      .launcher-container {
        background: linear-gradient(145deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.9) 100%);
      }
      .launcher-header h1 {
        background: linear-gradient(135deg, #f9fafb 0%, #a5b4fc 50%, #c4b5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .launcher-header p { color: #d1d5db; }
      .app-tile { background: rgba(31, 41, 55, 0.8); border-color: #4b5563; color: #f9fafb; }
      .app-tile .app-desc { color: #9ca3af; }
    }
  </style>
</head>
<body>
<div class="launcher-container">
  <div class="launcher-header">
    <h1>Your Applications</h1>
    <p>Select an application to continue</p>
  </div>

  <div class="app-grid" th:if="${not #lists.isEmpty(apps)}">
    <a class="app-tile" th:each="app : ${apps}" th:href="${app.url}">
      <img th:src="${app.iconUrl}" alt=""/>
      <span class="app-name" th:text="${app.name}">App Name</span>
      <span class="app-desc" th:text="${app.description}">Description</span>
    </a>
  </div>

  <p class="empty-state" th:if="${#lists.isEmpty(apps)}">
    No applications are currently available for your account.
  </p>
</div>
</body>
</html>
