# =====================================================================
# sso (ADEV-AUTH-SSO) - BASE configuration (all environments)
#
# Rules (SDS Step 1):
#   * Product defaults only. No hosts, local paths or secrets here.
#   * Instance values -> environment variables; secrets -> Key Vault secret names.
#   * Profiles: local = developer machine, cloud = every customer instance.
#
# STEP1 removals from the previous base file:
#   - spring.profiles.active (Maven activatedProperties token)
#   - server.ssl.* incl. keystore/truststore: TLS ends at the ingress in the cloud;
#     local HTTPS lives in application-local only
#   - Eureka registration now lives in the local profile with the port it really
#     uses (the old block registered 443 while listening on 8081). NOTE: the pom
#     has no Eureka client dependency, so these settings are inert unless one
#     arrives transitively; the startup log shows "DiscoveryClient" lines if so.
#   - auth.jwt.secret literal (now the shared platform-jwt-secret)
#   - Security DEBUG logging (local only)
# =====================================================================

spring.application.name=sso
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

dodaso.instance.customer-code=${DODASO_CUSTOMER_CODE}
dodaso.instance.display-name=${DODASO_CUSTOMER_NAME}
dodaso.instance.environment=${DODASO_ENVIRONMENT}
dodaso.instance.ecws-base-url=${DODASO_ECWS_BASE_URL}
dodaso.instance.elcm-base-url=${DODASO_ELCM_BASE_URL}
# The issuer IS this server's public URL; every token carries it.
dodaso.instance.auth-issuer-uri=${DODASO_AUTH_ISSUER_URI}
spring.security.oauth2.authorizationserver.issuer=${dodaso.instance.auth-issuer-uri}

# OAuth2 client used by both UIs (one client per UI arrives in Step 2)
dodaso.sso.client-id=jsf-primefaces-client
dodaso.sso.client-secret=${sso-jsf-client-secret}
# Signing key (PKCS8 PEM). Key Vault secret authserver-jwk-private-key; empty fails startup
# unless dodaso.sso.jwk-key-file is set (local profile only).
dodaso.sso.jwk-private-key=${authserver-jwk-private-key:}

# Honor X-Forwarded-Proto/Host from nginx or the cloud ingress, so redirects and
# the issuer-based URLs use the public https address.
server.forward-headers-strategy=framework

# Session
server.servlet.session.cookie.name=SSOSESSIONID
server.servlet.session.cookie.max-age=43200
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=1800
server.servlet.session.tracking-modes=cookie

# Authorization store: in-memory H2 until Step 2 moves it to MySQL.
# A restart therefore logs every user out.
spring.datasource.url=jdbc:h2:mem:sso
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Actuator: health (with liveness/readiness) and info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.build.enabled=true

# JWT (shared platform key)
auth.jwt.header=Authorization
auth.jwt.expiration=30000000
auth.jwt.secret=${platform-jwt-secret}

# JSF arrives through baseline-common; the SSO server renders with Thymeleaf.
spring.autoconfigure.exclude[0]=org.joinfaces.autoconfigure.JsfAutoConfiguration
spring.autoconfigure.exclude[1]=org.joinfaces.autoconfigure.tomcat.JsfTomcatAutoConfiguration
spring.autoconfigure.exclude[2]=org.joinfaces.autoconfigure.FacesAutoConfiguration

# App launcher (/apps). URLs derive from this instance's base URLs.
dodaso.apps[0].name=ELCM
dodaso.apps[0].description=Enterprise Lease Contract Management
dodaso.apps[0].icon-url=/images/elcm-icon.png
dodaso.apps[0].url=${dodaso.instance.elcm-base-url}/dashboard
dodaso.apps[0].required-authority=

dodaso.apps[1].name=ECWS
dodaso.apps[1].description=Enterprise Collaborative Workflow System
dodaso.apps[1].icon-url=/images/ecws-icon.png
dodaso.apps[1].url=${dodaso.instance.ecws-base-url}/dashboard
dodaso.apps[1].required-authority=

logging.pattern.level=%5p [${dodaso.instance.customer-code}]
logging.level.root=INFO
